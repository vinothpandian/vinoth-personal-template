name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# One run per branch; a new push cancels the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Mirrors `just check`: typecheck + lint + test + build.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build

  # Compile the CLI to a standalone linux-x64 binary. Uploaded as a build
  # artifact on every run; attached to the GitHub release on a `v*` tag.
  build-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: cd apps/cli && bun build --compile --target=bun-linux-x64 src/index.ts --outfile ../../pt-cli
      - uses: actions/upload-artifact@v4
        with:
          name: pt-cli
          path: pt-cli
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" pt-cli --generate-notes --title "${GITHUB_REF_NAME}" || gh release upload "${GITHUB_REF_NAME}" pt-cli --clobber
